harness: .
llm:
  provider: vllm_openai
  model: qwen3.6-35b
  temperature: 0.2
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  request_timeout: 120
agent:
  name: agentdojo-agent
  task: ''
graph:
  type: langchain_react
  max_iters: 12
  tool_call_format: 'TOOL_CALL: <name> <json>'
  stop_keyword: FINAL
  react_prompt: ''
  react_max_iterations: 20
  react_max_execution_time: 180
container:
  image: agent-scaffold-agentdojo:latest
  build_args:
    INSTALL_AGENTDOJO: "true"
monitoring:
  enabled: true
  output_path: trace_agentdojo.json
  print_trace: true
aegis:
  enabled: false
  mode: monitor
  risk_threshold: HIGH
pro2guard:
  enabled: true
  mode: monitor
  model_path: models/pro2guard/dtmc.json
  threshold: 0.1
  # Generated by the staged LLM classifier from existing DTMC states.
  unsafe_states: []
  generator:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    max_profiles: 50
    max_unsafe_states: 20
    max_model_states: 200
    state_batch_size: 8
    fail_closed: true
agentspec:
  enabled: false
  rules: []
  rule_files: []
  generator:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    max_rules: 12
toolsafe:
  enabled: false
  mode: replan
  threshold: 0.5
  provider: openai_compatible
  model: qwen3.6-35b
  base_url: http://localhost:8000/v1
  api_key_env: TOOLSAFE_API_KEY
  timeout_seconds: 30
  max_history_steps: 20
  max_replans: 3
  fail_closed: true
agentsight:
  enabled: false
  binary: runtime/bin/agentsight
  capture: full
  privilege: auto
  required: true
agentguard:
  enabled: false
  mode: block
  policy: rules/agentguard/agentdojo_policy.rules
  plugin_config: ""

  scenario_compiler:
    enabled: true
    context_mode: benign_only
    max_attempts: 2

  server_url: ""

  environment: benchmark
  user_id: ""
  role: default
  trust_level: 1

  sandbox: local
  audit_path: agentguard_audit.jsonl

  max_steps: 12
  max_tool_calls: 24
  window_size: 8

  remote_timeout_seconds: 5
  remote_retries: 2
  fail_closed: true
agentdog:
  enabled: false
  mode: gate
  task: unified
  model: qwen3.6-35b
  base_url: http://localhost:8000/v1
  timeout_seconds: 60
  fail_closed: false
