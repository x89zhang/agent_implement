harness: .
llm:
  provider: vllm_openai
  model: qwen3.6-35b
  temperature: 0.2
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  request_timeout: 120
agent:
  name: agent-security-bench-agent
  task: ''
graph:
  type: langchain_react
  max_iters: 12
  react_prompt: ''
  # action_only, legacy, or native_tool_calling (OpenAI/GPT native tools)
  react_protocol: action_only
  # OpenAI GPT action_only only; other providers keep their existing transport.
  openai_transport: responses
  # Continue OpenAI GPT action_only Responses runs via previous_response_id.
  openai_use_previous_response_id: true
  react_max_iterations: 20
  react_max_execution_time: 180
container:
  image: agent-scaffold-asb:latest
  build_args:
    INSTALL_AGENT_SECURITY_BENCH: "true"
monitoring:
  enabled: true
  output_path: trace_agent_security_bench.json
  print_trace: true
toolsafe:
  enabled: false
agentdog:
  enabled: false
