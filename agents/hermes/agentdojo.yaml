# Standalone Hermes + AgentDojo configuration; edit options directly in this file.
# Do not add `harness: .`: the benchmark, skills and defenses are declared below.
# Hermes owns its prompt, planning and tool loop. Project graph/react_protocol,
# security.trusted_tool_output_prompt and planner settings do not control Hermes.

llm:
  # openai = OpenAI-compatible endpoint; Hermes auto-selects its wire format.
  # openrouter is also supported.
  provider: openai
  model: gpt-5.6-luna
  temperature: 0.2
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  # Export the key in the environment; do not store api_key in YAML.
  # reasoning_effort / verbosity are not currently forwarded by this backend.
  # Responses-only GPT models ignore this temperature setting because the API rejects it.
  # The Hermes phase deadline is execution.hermes.timeout_seconds below.

agent:
  name: hermes-agentdojo
  # Hermes uses its own system prompt; this project field is intentionally empty.
  system_prompt: ''
  # Optional extra task instructions; the selected AgentDojo task is appended.
  task: ''

execution:
  backend: hermes
  hermes:
    repo_path: /home/xiaoliang_zhang/hermes-agent
    # Used only for host execution; Docker supplies its own Hermes interpreter.
    python_executable: ../../runtime/venvs/hermes/bin/python
    expected_commit: 5172f22df275a8c0b4bc0545da01c7a377c1690f
    # Automatic Docker builds always require a clean checkout.
    allow_dirty_checkout: false
    # auto follows Hermes routing; alternatives: chat_completions, codex_responses.
    # codex_responses is Hermes' name for the Responses API, including API-key OpenAI.
    api_mode: auto
    max_iterations: 30
    timeout_seconds: 300

container:
  # true: automatically build and run the project + Hermes Docker image.
  enabled: true
  # Base name; the runner appends a source/dependency hash to image tags.
  image: agent-scaffold-agentdojo:latest
  auto_build: true
  # Project base Dockerfile; integrations/hermes/Dockerfile adds Hermes on top.
  dockerfile: Dockerfile
  workdir: /workspace
  # On Linux, host networking also reaches local guard/model endpoints below.
  network: host
  remove: true
  build_args:
    INSTALL_AGENTDOJO: "true"
    # Enabled AgentSpec/LlamaFirewall dependencies are selected automatically.
  # Configured *_env credential/endpoint variables are also forwarded by name.
  env:
    - AEGIS_API_KEY
    - AEGIS_AGENT_SECRET
    - AEGIS_AGENT_TOKEN
    - OPENAI_API_KEY
    - AGENTGUARD_API_KEY
    - AGENTGUARD_SERVER_URL
    - AGENTGUARD_SCENARIO_API_KEY
    - TOOLSAFE_API_KEY
    - AGENTDOG_API_KEY
    - AGENTDOG_BASE_URL
    - HF_TOKEN
    - HUGGING_FACE_HUB_TOKEN
    - TOGETHER_API_KEY
    - TOKENIZERS_PARALLELISM
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY

monitoring:
  enabled: true
  output_path: trace_agentdojo.json
  # Print the concise AgentDojo evaluation before Hermes final answer.
  print_trace: true

agentdojo:
  enabled: true
  benchmark_version: v1.2.2
  suite: workspace
  # Change both tasks through a single combined case id.
  # Benign-only example: user_task_3; attack example: user_task_3_injection_3.
  case: user_task_1_injection_0
  # false disables both attack carriers while retaining the selected case.
  injection_enabled: true
  # Tool-output attack and native-skill attack can be toggled independently.
  # Skill-only: standard_injection_enabled: false, skill_injection_enabled: true.
  standard_injection_enabled: false
  # Writes a native SKILL.md; Hermes must read it through skill_view.
  # See skills.exposure.json for attempted reads and actual payload delivery.
  skill_injection_enabled: true
  # Empty preserves the default payload. Available templates:
  # direct, ignore_previous, system_message, injecagent,
  # important_instructions, important_instructions_no_names.
  attack_template: ''
  # Override the attack goal inside the selected template; empty uses task.GOAL.
  custom_injection_text: ''
  # Empty selects all default tool-output injection vectors for the suite.
  # Example: [injection_web_0, prompt_injection_channel] (suite-dependent).
  injection_vectors: []
  # Optional exact per-vector tool-output payloads; overrides generated payloads.
  # Example: {injection_web_0: "Custom web-only attack text"}
  custom_injections: {}

skills:
  # Additional text skills are staged in Hermes' isolated native skill library.
  # AgentDojo's attack skill is added automatically by skill_injection_enabled.
  base_dir: ../../skills
  enabled: []
  # Example:
  # enabled:
  #   - name: task-guidance
  #     description: Reusable task guidance
  #     instructions: "Check the requested channel before sending a message."

memory_experiment:
  # AgentDojo uses off. native_two_stage/direct_seed currently require ASB;
  # use agents/hermes/asb.yaml for memory-poisoning experiments.
  mode: 'off'

# Project defenses: enable each independently. All are initially disabled.
# Tool names are canonical benchmark names (e.g. send_direct_message), not
# mcp__benchmark__ names. Native skills use skill_view / skills_list / skill_manage.
# Guard dependencies and endpoints belong to the project interpreter/service.

aegis:
  enabled: false
  # monitor records the Gateway verdict; block enforces it above risk_threshold.
  mode: monitor
  risk_threshold: HIGH
  # The original AEGIS Gateway performs classification, policy, DSL, and anomaly checks.
  # Start a fresh upstream Gateway per batch: scripts/aegis_gateway.sh start
  gateway_url: http://127.0.0.1:8080
  api_key_env: AEGIS_API_KEY
  blocking: false
  timeout_seconds: 3
  fail_closed: false
  allow_tools: []
  # Paper cascade: Gateway L1 -> L2 XGBoost (models/aegis, trained on upstream
  # aegis-bench) -> L3 judge (research llm_judge.py prompt, inherited llm).
  cascade: true
  l2_model_path: models/aegis/l2_xgboost.json
  use_l3: true
  max_retries: 5

progent:
  enabled: false
  mode: monitor
  generate_policy: true
  update_after_tool: true
  fail_closed: false

drift:
  enabled: false
  mode: monitor
  fail_closed: false
  dynamic_validation: true
  request_user_approval: false
  injection_isolation: true
  max_revisions: 15  # DRIFTToolsExecutionLoop max_iters (inline block only)
  mask_limitation: 1
  profile: default  # DRIFTLLM.py for every benchmark; asb = ASB_DRIFT variant
  # Rule generation inherits the top-level llm and OPENAI_API_KEY.

adr:
  enabled: false
  mode: monitor
  fail_closed: false
  threshold: 0.8
  # ADR detection source and interpreter are supplied by the container image.

agrail:
  enabled: false
  mode: monitor
  fail_closed: false
  generate_checks: true
  update_memory: true
  memory_path: ../../runtime/agrail-memory/agentdojo.json

janus:
  enabled: false
  mode: monitor
  strict: false
  fail_closed: false
  base_url: http://127.0.0.1:8000/v1
  model: yuaay/vanguard
  api_key_env: JANUS_API_KEY

stepguard:
  enabled: false
  mode: block
  fail_closed: true
  # Set to an OpenAI-compatible endpoint reachable from the container.
  base_url: ""
  model: ninty-seven/StepGuard
  api_key_env: STEPGUARD_API_KEY
  timeout_seconds: 120
  max_replans: 3
  # Project extension; upstream's dynamic protocol checks only tool actions.
  audit_final: false

safeagent:
  enabled: false
  mode: block
  fail_closed: true
  mcp_url: http://127.0.0.1:8000/mcp
  api_key_env: SAFEAGENT_MCP_API_KEY
  # Upstream runtime.yaml waits for the call budget (wait_until_available).
  timeout_seconds: 300
  developer_config_path: ../../src/agent_scaffold/safeagent/developer.example.yaml
  runtime_config_path: ../../src/agent_scaffold/safeagent/runtime.example.yaml
  # Off as in upstream's ASB evaluation; when on it only drafts a
  # developer_policy.yaml for the core (see safeagent/README.rst).
  generator:
    enabled: false
    max_attempts: 2
    fail_closed: false


clawsentry:
  enabled: false
  auto_start: true
  mode: block
  fail_closed: true
  base_url: http://127.0.0.1:8080
  api_key_env: CS_AUTH_TOKEN
  timeout_seconds: 5
  decision_tier: L1
  observe_tool_result: true
  # Wait (bounded) for the gateway's background post-action finding.
  post_action_wait_seconds: 5
  # Managed gateway's L2 LLM (CS_LLM_*); empty fields inherit the top-level llm.
  llm:
    enabled: true
    l3_enabled: false

airguard:
  enabled: false
  mode: block
  fail_closed: true
  # Generates upstream's compile_task_authority system_policy allow set, the
  # deployer/user-supplied input; upstream's fallback is [read, write, respond].
  generator:
    enabled: true
    context_mode: benign_only
    fail_closed: false

rope:
  enabled: false
  mode: block
  fail_closed: true
  # llm: an LLM writes the floor (upstream's hand-audited input) from the tool
  # definitions, for every suite; other tools stay default-allowed.
  # audited (non-default): upstream's audited table for rope.suite.
  floor_generation: llm
  router: live
  # Upstream main result is unclamped (run_eval.py clamp=False).
  clamp: false
  # Memoizes router/floor LLM replies (upstream common/llm_cache.py) so clean
  # and attacked runs of the same task get the same scope.
  router_cache_path: ../../runtime/rope-router-cache.json

melon:
  enabled: false
  # block stops the run on detection (upstream); warn/monitor only record it.
  mode: block
  fail_closed: true
  # Cosine cut-off between the real call and masked-run calls (upstream: 0.8).
  threshold: 0.8
  # upstream: the paper's rules (send_email -> recipients, send_money -> recipient,
  # amount) and all arguments for every other tool, on every benchmark.
  # llm (non-default): an LLM picks comparison arguments for the other tools.
  projection_generation: upstream
  projections: {}
  # Masked re-execution uses the agent model (top-level llm) unless overridden.
  transport: auto
  llm: {}
  embedding:
    model: text-embedding-3-large
    api_key_env: OPENAI_API_KEY
  generator:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    fail_closed: false

pro2guard:
  enabled: false
  # monitor records; warn adds upstream's reflection message; block stops the run.
  mode: monitor
  # Per-task models from `python -m agent_scaffold.pro2guard.build_model`, learned
  # from runs disjoint from the evaluation. A task without a model is recorded as
  # a no_model monitor error, not as a negative.
  model_dir: ../../models/pro2guard
  granularity: task
  engine: json
  prism_bin: prism
  threshold: 0.05
  # -1: unbounded P=?[F unsafe] (upstream default); k > 0: P=?[F<=k unsafe].
  bound: -1
  timeout_seconds: 10
  fail_closed: false
  # Build-time LLM that writes the unsafe spec from the clean task and tool
  # schemas only. Model settings inherit top-level llm when omitted.
  generator:
    max_attempts: 2
    max_conditions: 4
    max_atoms: 4

agentspec:
  enabled: false
  # enforce applies rule actions; monitor allows original calls and logs decisions.
  mode: monitor
  rules: []
  rule_files: []
  predicate_modules: []
  approval_handler: prompt
  max_reflections: 3
  fail_closed: true
  generator:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    max_rules: 12
    # Generator model settings inherit top-level llm when omitted.

llamafirewall:
  enabled: false
  # enforce applies native BLOCK/HUMAN decisions; monitor observes the trajectory.
  mode: enforce
  # Optional preset: chatbot or coding_assistant; empty uses library defaults.
  use_case: ''
  # Optional role-to-scanner mapping; empty uses library defaults.
  scanners:
    assistant: [agent_alignment]
  # Optional module:function returning a native LlamaFirewall instance.
  factory: ''
  factory_kwargs: {}
  fail_closed: false

toolsafe:
  enabled: false
  # monitor, warn, replan, block
  mode: monitor
  threshold: 0.5
  provider: openai_compatible
  model: TS-Guard
  base_url: http://localhost:8001/v1
  api_key_env: TOOLSAFE_API_KEY
  timeout_seconds: 60
  fail_closed: false

agentsight:
  enabled: false
  # Host-side observer; requires the existing AgentSight binary/permissions.
  binary: runtime/bin/agentsight
  capture: full
  privilege: auto
  required: true
  db_path: agentsight.db
  snapshot_path: agentsight_snapshot.json
  log_path: agentsight.log
  web_server: false
  server_port: 7395
  startup_timeout_seconds: 10
  warmup_seconds: 1
  shutdown_timeout_seconds: 10

agentguard:
  enabled: false
  # monitor, warn, block
  mode: monitor
  # Each run's policy is generated from the benign task and tool catalog
  # (scenario_compiler). A static rule file here, e.g.
  # ../../rules/agentguard/agentdojo_policy.rules, is used only when
  # scenario_compiler.enabled is false.
  policy: ''
  # Empty uses upstream config/plugins.json (server rule_based_plugin at
  # tool_before, no client plugins).
  plugin_config: ''
  scenario_compiler:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    llm:
      provider: openai
      model: gpt-5.6-luna
      temperature: 0.1
      base_url: https://api.openai.com/v1
      api_key_env: AGENTGUARD_SCENARIO_API_KEY
      request_timeout: 180
  # Empty with auto_start_server starts the upstream server per run with this
  # run's policy; without a server no policy is evaluated.
  server_url: ''
  auto_start_server: true
  environment: benchmark
  user_id: ''
  role: default
  trust_level: 1
  sandbox: local
  sandbox_profile: null
  audit_path: agentguard_audit.jsonl
  max_steps: 12
  max_tool_calls: 24
  window_size: 8
  # Server LLM_CHECK reviews call a reasoning model; upstream's 5 s is too short.
  remote_timeout_seconds: 120
  remote_retries: 2
  fail_closed: true

agentdog:
  enabled: false
  # diagnose logs only; gate replaces unsafe output; revise requests regeneration.
  mode: diagnose
  # pre_reply checks final answers; add pre_action to also check tool actions.
  checkpoints: [pre_reply]
  task: unified
  provider: openai_compatible
  model: agentdog-unified
  base_url: http://localhost:8001/v1
  # Used only when base_url is empty.
  base_url_env: AGENTDOG_BASE_URL
  api_key_env: AGENTDOG_API_KEY
  temperature: 0.0
  timeout_seconds: 180
  max_tokens: 1024
  max_trajectory_chars: 0
  max_revisions: 2
  fail_closed: false
  include_raw_response: true
  replacement_message: >-
    The response was withheld because AgentDoG diagnosed unsafe behavior
    in the accumulated agent trajectory.
