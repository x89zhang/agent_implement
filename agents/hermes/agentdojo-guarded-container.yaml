# Hermes native skills + project defense + automatic Docker build.
llm:
  provider: openai
  model: gpt-5.6-luna
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.2
agent:
  name: hermes-agentdojo-guarded-container
  system_prompt: ''
  task: ''
container:
  enabled: true
  auto_build: true
  network: host
monitoring:
  enabled: true
execution:
  backend: hermes
  hermes:
    repo_path: /home/xiaoliang_zhang/hermes-agent
    python_executable: ../../runtime/venvs/hermes/bin/python
    expected_commit: 5172f22df275a8c0b4bc0545da01c7a377c1690f
    max_iterations: 30
    timeout_seconds: 300
agentdojo:
  enabled: true
  benchmark_version: v1.2.2
  suite: slack
  case: user_task_15_injection_5
  injection_enabled: true
  standard_injection_enabled: false
  skill_injection_enabled: true
aegis:
  enabled: true
  mode: block
  risk_threshold: HIGH
progent:
  enabled: false
  mode: monitor
  generate_policy: true
  update_after_tool: false
  fail_closed: false

drift:
  enabled: false
  mode: monitor
  fail_closed: false
  dynamic_validation: true
  injection_isolation: true
  max_revisions: 2
  max_mask_passes: 2
  # Rule generation inherits the top-level llm and OPENAI_API_KEY.

adr:
  enabled: false
  mode: monitor
  fail_closed: false
  threshold: 0.8
  # ADR detection source and interpreter are supplied by the container image.

rope:
  enabled: false
  mode: block
  fail_closed: true
  floor_generation: llm
  router: live
  clamp: true
  trusted_origin_tools: []

agrail:
  enabled: false
  mode: monitor
  fail_closed: false
  generate_checks: true
  update_memory: true
  generator:
    context_mode: benign_only

janus:
  enabled: false
  mode: monitor
  strict: false
  fail_closed: false
  base_url: http://127.0.0.1:8000/v1
  model: yuaay/vanguard
  api_key_env: JANUS_API_KEY

stepguard:
  enabled: false
  mode: block
  fail_closed: true
  # Set to an OpenAI-compatible endpoint reachable from the container.
  base_url: ""
  model: ninty-seven/StepGuard
  api_key_env: STEPGUARD_API_KEY
  timeout_seconds: 120
  max_replans: 3
  audit_final: true

safeagent:
  enabled: false
  mode: block
  fail_closed: true
  mcp_url: http://127.0.0.1:8000/mcp
  api_key_env: SAFEAGENT_MCP_API_KEY
  timeout_seconds: 60
  developer_config_path: ../../src/agent_scaffold/safeagent/developer.example.yaml
  runtime_config_path: ../../src/agent_scaffold/safeagent/runtime.example.yaml
  max_replans: 1
  generator:
    enabled: true
    max_attempts: 2
    fail_closed: false


clawsentry:
  enabled: false
  auto_start: true
  mode: block
  fail_closed: true
  base_url: http://127.0.0.1:8080
  api_key_env: CS_AUTH_TOKEN
  timeout_seconds: 5
  decision_tier: L1
  observe_tool_result: true

melon:
  enabled: false
  # block stops the run on detection (upstream); warn/monitor only record it.
  mode: block
  fail_closed: true
  # Cosine cut-off between the real call and masked-run calls (upstream: 0.8).
  threshold: 0.8
  # llm: paper rules (send_email/send_money) + LLM-generated comparison
  # arguments for other tools; upstream: paper rules only, all args elsewhere.
  projection_generation: llm
  projections: {}
  # Masked re-execution uses the agent model (top-level llm) unless overridden.
  transport: auto
  llm: {}
  embedding:
    model: text-embedding-3-large
    api_key_env: OPENAI_API_KEY
  generator:
    enabled: true
    context_mode: benign_only
    max_attempts: 2
    fail_closed: false

airguard:
  enabled: false
  mode: block
  fail_closed: true
  generator:
    enabled: true
    context_mode: benign_only
    fail_closed: false

pro2guard:
  enabled: false
  mode: monitor
  model_path: ../../models/pro2guard/dtmc.new.json
  threshold: 0.1
  fail_closed: false
  generator:
    enabled: true
    context_mode: benign_only

agentspec:
  enabled: false
  mode: monitor
  fail_closed: true
  generator:
    enabled: true
    context_mode: benign_only

llamafirewall:
  enabled: false
  mode: enforce
  fail_closed: false

toolsafe:
  enabled: false
  mode: monitor
  threshold: 0.5
  provider: openai_compatible
  model: TS-Guard
  base_url: http://localhost:8001/v1
  api_key_env: TOOLSAFE_API_KEY
  fail_closed: true

agentsight:
  enabled: false
  binary: runtime/bin/agentsight
  capture: full
  privilege: auto
  required: true

agentguard:
  enabled: false
  mode: monitor
  policy: ../../rules/agentguard/agentdojo_policy.rules
  fail_closed: true
  scenario_compiler:
    enabled: true
    context_mode: benign_only

agentdog:
  enabled: false
  mode: diagnose
  checkpoints: [pre_reply]
  provider: openai_compatible
  model: agentdog-unified
  base_url: http://localhost:8001/v1
  api_key_env: AGENTDOG_API_KEY
  fail_closed: false
